version: 2

project_name: whop

builds:
  - id: whop
    main: ./cmd/whop
    binary: whop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X whop/internal/cli.Version={{ .Version }}

archives:
  - id: whop
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
