version: 2

project_name: whop

builds:
  - id: whop
    main: ./cmd/whop
    binary: whop
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X whop/internal/cli.Version={{ .Tag }}

archives:
  - id: whop
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

aurs:
  - name: whop-bin
    ids:
      - whop
    homepage: "https://github.com/vvinnpy/whop"
    description: "Local-first terminal connection deck with SSH, sessions, and automation"
    license: "MIT"
    maintainers:
      - "Wimpy <vvinnpy@gmail.com>"
    provides:
      - whop
    conflicts:
      - whop
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/whop-bin.git"
    skip_upload: '{{ if and (not .IsSnapshot) .Env.AUR_KEY }}auto{{ else }}true{{ end }}'
    package: |
      install -Dm755 "./whop" "${pkgdir}/usr/bin/whop"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/whop-bin/LICENSE"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
