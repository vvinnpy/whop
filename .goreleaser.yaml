version: 2

project_name: ttydeck

before:
  hooks:
    - go mod tidy

builds:
  - id: ttydeck
    main: ./cmd/ttydeck
    binary: ttydeck
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X ttydeck/internal/cli.Version={{ .Version }}

archives:
  - id: ttydeck
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
