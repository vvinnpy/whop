name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: mod tidy
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(go mod tidy -diff)"
      - name: vet
        run: go vet ./...
      - name: test
        shell: bash
        run: |
          set -o pipefail
          go test -json ./... | tee gotest.jsonl
      - name: report test failures
        if: failure()
        shell: bash
        run: |
          if [ ! -f gotest.jsonl ]; then
            exit 0
          fi
          (grep '"Action":"output"' gotest.jsonl || true) | grep -E '"_test\.go:[0-9]+:' | tail -20 | while IFS= read -r line; do
            echo "::error title=go test failure::$line"
          done
          (grep '"Action":"fail"' gotest.jsonl || true) | tail -10 | while IFS= read -r line; do
            echo "::error title=go test package::$line"
          done
      - name: build
        shell: bash
        run: CGO_ENABLED=0 go build ./...

  race:
    name: race-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: race
        run: go test -race ./...

  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: cross compile
        shell: bash
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./...
          done

  release-check:
    name: release-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: goreleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
      - name: goreleaser snapshot
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
